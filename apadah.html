
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #21618c;
        }

        h3 {
            color: #2c3e50;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Kalkulator Sederhana</h2>

        <input type="number" id="angka1" placeholder="Masukkan angka pertama">

        <input type="number" id="angka2" placeholder="Masukkan angka kedua">

        <br>

        <button onclick="hitung('+')">+</button>
        <button onclick="hitung('-')">-</button>
        <button onclick="hitung('*')">×</button>
        <button onclick="hitung('/')">÷</button>

        <h3 id="hasil">Hasil: </h3>

        <button onclick="reset()">Reset</button>
    </div>

    <script>
        // Function untuk menghitung
        function hitung(operator) {

            let angka1 = parseFloat(document.getElementById("angka1").value);
            let angka2 = parseFloat(document.getElementById("angka2").value);

            let hasil;

            if (isNaN(angka1) || isNaN(angka2)) {
                alert("Masukkan kedua angka terlebih dahulu!");
                return;
            }

            if (operator == "+") {
                hasil = angka1 + angka2;
            }
            else if (operator == "-") {
                hasil = angka1 - angka2;
            }
            else if (operator == "*") {
                hasil = angka1 * angka2;
            }
            else if (operator == "/") {
                if (angka2 == 0) {
                    hasil = "Tidak bisa dibagi nol!";
                } else {
                    hasil = angka1 / angka2;
                }
            }

            document.getElementById("hasil").innerHTML = "Hasil: " + hasil;
        }

        // Function untuk reset
        function reset() {
            document.getElementById("angka1").value = "";
            document.getElementById("angka2").value = "";
            document.getElementById("hasil").innerHTML = "Hasil: ";
        }
    </script>

</body>
</html>
